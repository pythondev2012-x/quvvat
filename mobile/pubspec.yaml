name: quvvat
description: "Quvvat — santexnika do'koni mobil ilovasi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
          weight: 400
        - asset: assets/fonts/Onest.ttf
          weight: 500
        - asset: assets/fonts/Onest.ttf
          weight: 600
        - asset: assets/fonts/Onest.ttf
          weight: 700
        - asset: assets/fonts/Onest.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
          weight: 500
        - asset: assets/fonts/Unbounded.ttf
          weight: 600
        - asset: assets/fonts/Unbounded.ttf
          weight: 700
        - asset: assets/fonts/Unbounded.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/quvvat_icon.png"
  adaptive_icon_background: "#D71920"
  adaptive_icon_foreground: "assets/icon/quvvat_foreground.png"
  remove_alpha_ios: true
